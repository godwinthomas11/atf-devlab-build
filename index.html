<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KasiBook: the spaza credit book</title>
<meta name="description" content="A credit book for spaza shops. See who owes what and remind them on WhatsApp. Works offline.">
<meta name="theme-color" content="#0f5132">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root { color-scheme: light; --forest: #064e36; --green: #087b4d; --bg: #f4f1ea; --ink: #17231c; --muted: #5b645e; --line: #e7e2d6; --gold: #f4c542; --shadow: 0 1px 2px rgba(23, 35, 28, .06), 0 8px 24px rgba(23, 35, 28, .07); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { display: flex; flex-direction: column; max-width: 480px; min-height: 100vh; margin: 0 auto; background: var(--bg); }
#app > * { flex: 1; display: flex; flex-direction: column; }
h1, h2, p, ol { margin: 0; }
h1 { font-size: 26px; line-height: 1.2; letter-spacing: -.3px; }
h2 { font-size: 18px; margin-bottom: 12px; }
h1, #toast { overflow-wrap: anywhere; }
button, input { font: inherit; color: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.top :focus-visible, .side :focus-visible { outline-color: var(--gold); }
.icon { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Green header shared by every screen */
.top { padding: 18px 20px 26px; border-radius: 0 0 28px 28px; color: #fff; background: radial-gradient(circle at 100% 0, rgba(255, 255, 255, .13) 0 130px, transparent 131px), radial-gradient(circle at 0 100%, rgba(255, 255, 255, .07) 0 90px, transparent 91px), linear-gradient(155deg, #053d2b, #064e36 45%, #0a7a4d); }
.top .label { font-size: 16px; opacity: .92; }
.shop { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0; border: 0; background: none; color: #fff; font-size: 26px; font-weight: 800; text-align: left; cursor: pointer; }
.total { font-size: 44px; font-weight: 800; line-height: 1.15; letter-spacing: -1px; margin: 2px 0 8px; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-bottom: 4px; color: #fff; font-weight: 600; text-decoration: none; }
.top .link { padding-left: 0; color: #fff; font-weight: 600; }
.top .badge { display: inline-block; }

/* Welcome */
.welcome .top { padding-bottom: 34px; text-align: center; }
.logo { display: grid; place-items: center; width: 76px; height: 76px; margin: 14px auto 16px; border-radius: 24px; background: #fff; color: var(--green); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
.welcome h1 { font-size: 30px; }
.lead { margin-top: 8px; font-size: 18px; opacity: .95; }
.steps { list-style: none; margin: -18px 16px 0; padding: 6px 18px; border-radius: 18px; background: #fff; box-shadow: var(--shadow); }
.steps li { display: flex; align-items: center; gap: 14px; padding: 14px 0; }
.steps li + li { border-top: 1px solid var(--line); }
.steps strong { display: block; line-height: 1.3; }
.steps small, .tile small { display: block; color: var(--muted); font-size: 14px; line-height: 1.3; }
.tile small { font-size: 13px; }
.promise { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 16px 20px 0; color: var(--green); font-size: 15px; font-weight: 700; }

/* Header band: brand, profile and the money card */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; letter-spacing: .2px; }
.me { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid rgba(255, 255, 255, .3); border-radius: 50%; background: rgba(255, 255, 255, .16); color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; }
.date { display: none; }
.hero { margin-top: 14px; padding: 16px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 18px; background: rgba(3, 40, 28, .42); }
.hero-main { display: flex; align-items: center; gap: 14px; }
.hero-main .total { margin: 0; font-size: 38px; }
.coin { flex: none; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; background: rgba(255, 255, 255, .14); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .18); text-align: center; }
.kpis p + p { border-left: 1px solid rgba(255, 255, 255, .18); }
.kpis strong { display: block; font-size: 16px; white-space: nowrap; }
.kpis span { display: block; font-size: 13px; line-height: 1.25; opacity: .92; }
.banner { display: flex; align-items: center; gap: 10px; margin: 16px 16px 0; padding: 10px 10px 10px 16px; border-radius: 16px; background: #fff0c7; color: #5e4100; font-size: 15px; font-weight: 600; line-height: 1.3; }
.banner span { flex: 1; }
.banner i { display: none; font-style: normal; }
.send { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 14px; border-radius: 12px; background: var(--forest); color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; }

/* Home */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 16px; }
.tile { display: flex; align-items: center; gap: 8px; min-height: 72px; padding: 10px; border: 0; border-radius: 16px; background: #fff; box-shadow: var(--shadow); color: inherit; text-align: left; text-decoration: none; cursor: pointer; }
.tile .bubble { width: 36px; height: 36px; margin: 0; border-radius: 13px; }
.tile > span:nth-child(2) { flex: 1; min-width: 0; }
.tile strong { display: block; font-size: 14px; line-height: 1.25; }
.tile > .icon { display: none; color: #9aa29c; }

/* A customer in a list. On a phone it is a card; in desktop view the same parts line up as a table row. */
.cust { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; grid-template-areas: "av who amt" "av status amt" ". bought bought" "acts acts acts"; column-gap: 14px; align-items: center; padding: 14px 16px; }
.cust:active { background: #f3f0e8; }
.cust .avatar { grid-area: av; }
.cust-link { grid-area: who; overflow: hidden; color: inherit; font-weight: 700; text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
.cust-link::after { content: ""; position: absolute; inset: 0; } /* the whole card opens the customer */
.cust .badge { grid-area: status; justify-self: start; margin-top: 4px; }
.amt { grid-area: amt; font-size: 18px; font-weight: 800; white-space: nowrap; }
.bought { grid-area: bought; margin-top: 6px; overflow: hidden; color: var(--muted); font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
.acts { grid-area: acts; position: relative; z-index: 1; display: flex; gap: 8px; margin-top: 10px; }
.thead, .compact .bought, .compact .acts { display: none; }

/* Phone navigation, fixed to the bottom */
.has-tabs { padding-bottom: 92px; }
#app > .tabbar { position: fixed; left: 50%; bottom: 0; z-index: 4; flex: none; flex-direction: row; align-items: center; justify-content: space-around; width: min(100%, 480px); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #fff; transform: translateX(-50%); }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 64px; min-height: 48px; color: var(--muted); font-size: 12px; font-weight: 600; text-decoration: none; }
.tabbar a[aria-current="page"] { color: var(--green); }
#app > .viewswitch { position: fixed; top: 16px; right: 16px; z-index: 4; flex: none; flex-direction: row; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 0; border-radius: 99px; background: #fff; box-shadow: var(--shadow); color: var(--green); font-size: 15px; font-weight: 700; cursor: pointer; }
.plus { display: grid; place-items: center; width: 54px; height: 54px; margin-top: -20px; border: 4px solid #fff; border-radius: 50%; background: var(--green); color: #fff; box-shadow: 0 6px 16px rgba(8, 123, 77, .35); cursor: pointer; }

.section { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 20px 12px; }
.section h2 { margin: 0; }
.section a { margin: -10px 0; padding: 10px 0 10px 12px; color: var(--green); font-size: 16px; font-weight: 700; }
.bubble { flex: none; display: grid; place-items: center; width: 46px; height: 46px; margin-bottom: 6px; border-radius: 15px; background: #e3f1e8; color: var(--green); }
.bubble.gold { background: #fdf0c8; color: #7a5600; }
.bubble.blue { background: #e1ecfb; color: #1d4f91; }
.bubble.coral { background: #fde4dc; color: #9a3412; }

/* Lists and cards */
.card, .list { margin: 16px 16px 0; border-radius: 18px; background: #fff; box-shadow: var(--shadow); }
.section + .list, .section + .tiles { margin-top: 0; }
.card { padding: 18px; }
.note { margin: 16px 20px 0; color: var(--muted); font-size: 16px; }
.empty { color: var(--muted); }
.list { list-style: none; padding: 0; overflow: hidden; }
.list li:not([hidden]):not(.thead) + li, .history li + li { border-top: 1px solid var(--line); }
.avatar { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #e3f1e8; color: var(--green); font-weight: 800; }
.badge { white-space: nowrap; padding: 2px 10px; border-radius: 99px; background: #ece8dd; color: #45423a; font-size: 14px; font-weight: 600; }
.badge.due { background: #fde9b8; color: #5e4100; }
.badge.late { background: #fbd5d0; color: #8a1c12; }
.badge.ok { background: #d7f0df; color: var(--green); }
.search { position: relative; margin: 16px 16px 0; }
.search .icon { position: absolute; left: 16px; top: 17px; color: var(--muted); }
.search input { margin: 0; padding-left: 48px; border-color: transparent; box-shadow: var(--shadow); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 16px 0; }
.filter { flex: none; min-height: 40px; padding: 0 14px; border: 0; border-radius: 99px; background: #fff; box-shadow: var(--shadow); color: var(--muted); font-size: 15px; font-weight: 700; cursor: pointer; }
.filter[aria-pressed="true"] { background: var(--green); color: #fff; }
.act { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 99px; background: #eaf2ec; color: var(--green); font-size: 15px; font-weight: 700; text-decoration: none; white-space: nowrap; }
.act.wa { background: var(--green); color: #fff; }
.items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
.item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 4px; border: 2px solid var(--line); border-radius: 15px; background: #fff; font-size: 14px; font-weight: 700; line-height: 1.25; cursor: pointer; }
.item span { font-size: 24px; }
.item small { color: var(--muted); font-size: 14px; font-weight: 600; }

/* Customer */
.tabs { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 18px; padding: 4px; border-radius: 15px; background: #edeee8; }
.tab { height: 48px; border: 0; border-radius: 12px; background: none; color: var(--muted); font-weight: 700; cursor: pointer; }
.tab[aria-pressed="true"] { background: #fff; color: var(--green); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.tab:disabled { opacity: .5; cursor: default; }
.chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
.chip { height: 60px; border: 2px solid var(--green); border-radius: 15px; background: #fff; color: var(--green); font-size: 19px; font-weight: 800; cursor: pointer; }
label { display: block; margin-bottom: 6px; font-size: 16px; font-weight: 600; }
input { width: 100%; height: 56px; margin-bottom: 12px; padding: 0 16px; border: 2px solid #b9b3a4; border-radius: 15px; background: #fff; }
input:focus { border-color: var(--green); outline: 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 16px; border: 2px solid var(--green); border-radius: 15px; background: #fff; color: var(--green); font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--green); color: #fff; box-shadow: 0 6px 16px rgba(15, 81, 50, .25); }
.btn.ghost { margin-top: 10px; border-color: transparent; background: #eaf2ec; }
.btn.whatsapp { width: auto; margin: 16px 16px 0; border-color: #25d366; background: #25d366; color: #06301a; box-shadow: 0 6px 16px rgba(37, 211, 102, .3); }
.chip:active, .btn:active, .tile:active, .item:active, .act:active { transform: scale(.97); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.error { margin-bottom: 10px; color: #a3190d; font-size: 16px; font-weight: 600; }
.error:empty { display: none; }
.link { padding: 8px 4px; border: 0; background: none; color: var(--green); font-weight: 700; text-decoration: underline; cursor: pointer; }
.link.danger { margin: 12px auto 24px; color: #a3190d; }
.history { list-style: none; margin: 0; padding: 0; }
.history li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 16px; }
.history strong { white-space: nowrap; }
.history a { padding: 10px 0; }
.history .paid { color: #187a4b; }
.head { display: flex; justify-content: space-between; align-items: baseline; }

#toast { position: fixed; left: 50%; top: 12px; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; width: min(448px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 15px; background: var(--ink); color: #fff; font-size: 16px; transform: translateX(-50%); box-shadow: 0 10px 30px rgba(0, 0, 0, .3); }
#toast[hidden] { display: none; }
#toast .link { flex: none; color: var(--gold); }
dialog { width: min(92vw, 440px); margin-top: 16px; padding: 22px; border: 0; border-radius: 22px; box-shadow: 0 30px 80px rgba(0, 0, 0, .35); }
dialog::backdrop { background: rgba(10, 30, 20, .55); }

/* On a laptop the app sits in the middle like a phone */
@media (min-width: 600px) {
  body { padding: 24px 0; background: linear-gradient(160deg, #0f5132, #072a1a) fixed; }
  #app { min-height: calc(100vh - 48px); border-radius: 32px; box-shadow: 0 30px 80px rgba(0, 0, 0, .4); }
  .top { border-radius: 32px 32px 28px 28px; }
  body:not(.wide) { padding-bottom: 0; }
  body:not(.wide) #app { min-height: calc(100vh - 24px); border-radius: 32px 32px 0 0; }
}
/* Desktop view: offered on a laptop or office computer. A sidebar for getting around, the page beside it. */
.ask { margin-bottom: 6px; font-size: 16px; font-weight: 600; }
body.wide { padding: 0; background: var(--bg); }
.wide #app { max-width: none; min-height: 100vh; border-radius: 0; box-shadow: none; }
.wide #app.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); align-items: start; background: linear-gradient(90deg, var(--forest) 248px, var(--bg) 248px); }
.wide #app > :not(.welcome):not(.side):not(.main) { align-self: center; width: 100%; max-width: 480px; }
.wide #toast { top: auto; bottom: 24px; }

.side { position: sticky; top: 0; height: 100vh; padding: 28px 16px 16px; background: var(--forest); color: #fff; }
.side .brand { margin: 0 12px 32px; font-size: 22px; }
.side nav { display: flex; flex-direction: column; gap: 4px; }
.navlink { display: flex; align-items: center; gap: 14px; min-height: 46px; padding: 0 14px; border-radius: 12px; color: rgba(255, 255, 255, .88); font-size: 16px; font-weight: 600; text-decoration: none; }
.navlink:hover { background: rgba(255, 255, 255, .08); }
.navlink[aria-current="page"] { background: var(--green); color: #fff; }
.side-foot { margin-top: auto; color: rgba(255, 255, 255, .8); font-size: 13px; }
.side-foot .ask { font-size: 13px; }
.side-foot .tabs { margin-bottom: 12px; background: rgba(0, 0, 0, .28); }
.side-foot .tab { height: 36px; color: rgba(255, 255, 255, .8); font-size: 14px; }
.side-foot .tab[aria-pressed="true"] { color: var(--green); }
.profile { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 1px solid rgba(255, 255, 255, .18); border-radius: 14px; background: rgba(255, 255, 255, .06); color: #fff; text-align: left; cursor: pointer; }
.profile > span:last-child { min-width: 0; }
.profile strong { display: block; overflow: hidden; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
.profile small { color: rgba(255, 255, 255, .75); font-size: 13px; }

.main { --gutter: max(32px, calc((100vw - 248px - 1240px) / 2)); padding: 0 var(--gutter) 48px; }
.main > * { margin-right: 0; margin-left: 0; }
.main > .top { position: relative; margin: 0 calc(-1 * var(--gutter)); padding: 28px var(--gutter); border-radius: 0; }
.main > .top:has(.hero) { padding-bottom: 0; background-repeat: no-repeat; background-size: 100% calc(100% - 52px); }
.main .topbar { position: absolute; top: 28px; right: var(--gutter); margin: 0; }
.main .topbar .brand, .main .topbar .me, .main .bought { display: none; }
.main .date { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border: 1px solid rgba(255, 255, 255, .25); border-radius: 12px; background: rgba(255, 255, 255, .08); font-size: 15px; font-weight: 600; }
.main .shop, .main .top h1 { font-size: 32px; letter-spacing: -.02em; }
.main .hero { margin-top: 20px; padding: 22px 28px; border-color: rgba(255, 255, 255, .18); background: linear-gradient(135deg, #075a3d, #0a6e49); box-shadow: 0 14px 30px rgba(6, 78, 54, .28); }
.main .hero:has(.kpis) { display: flex; align-items: center; gap: 24px; }
.main .hero-main { flex: 1.3; gap: 20px; }
.main .hero-main .total { font-size: 46px; letter-spacing: -.02em; }
.main .coin { width: 72px; height: 72px; border-radius: 20px; }
.main .kpis { flex: 2; margin: 0; padding: 0; border: 0; }
.main .kpis p { border-left: 1px solid rgba(255, 255, 255, .18); }
.main .kpis strong { margin-top: 4px; font-size: 20px; }
.main .kpis span { font-size: 15px; }
.main .banner { padding: 12px 12px 12px 20px; font-size: 16px; }
.main .banner i { display: inline; }
.main .tiles { grid-template-columns: repeat(4, 1fr); gap: 16px; }
.main .tile { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 12px 8px; padding: 18px; }
.main .tile .bubble { grid-column: 1 / -1; width: 46px; height: 46px; }
.main .tile > .icon { display: block; align-self: center; }
.main .tile strong { font-size: 17px; }
.main .tile small { font-size: 14px; }
.main .cust, .main .thead { grid-template-columns: 44px minmax(0, 1.5fr) minmax(0, 1fr) 130px 290px; grid-template-areas: "av who status amt acts"; padding: 12px 20px; }
.main .thead { display: grid; column-gap: 14px; color: var(--muted); font-size: 14px; font-weight: 600; }
.main .thead span:first-child { grid-column: 1 / span 2; }
.main .cust .badge, .main .acts { margin: 0; }
.main .compact .acts { display: flex; }
.main .whatsapp { margin-right: 0; margin-left: 0; }
.wide #app > .main.split { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto 1fr auto; column-gap: 20px; }
.split > .top, .split > .link { grid-column: 1 / -1; }
.main.split > .link { justify-self: center; }
.main.split > section:first-of-type { grid-row: 2 / span 2; }
.main.split > .whatsapp, .main.split > section:last-of-type { align-self: start; }
@media (max-width: 1239px) {
  .main .tiles { grid-template-columns: 1fr 1fr; }
  .main .cust, .main .thead { grid-template-columns: 44px minmax(0, 1fr) 150px 96px; grid-template-areas: "av who status amt" ". acts acts acts"; }
  .main .thead span:last-child { display: none; }
  .main .acts { margin-top: 8px; }
}

.wide #app > .welcome { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; align-content: center; background: linear-gradient(90deg, var(--forest) 50%, var(--bg) 50%); }
.wide .welcome .top { grid-column: 1; grid-row: 1; padding: 0 64px; border-radius: 0; background: none; text-align: left; }
.wide .welcome .logo { margin: 0 0 28px; }
.wide .welcome h1 { font-size: 44px; line-height: 1.08; letter-spacing: -.02em; }
.wide .welcome .lead { max-width: 24em; font-size: 20px; }
.wide .welcome .steps { grid-column: 1; grid-row: 2; margin: 32px 64px 0; background: rgba(255, 255, 255, .1); box-shadow: none; color: #fff; }
.wide .welcome .steps strong { font-size: 19px; }
.wide .welcome .steps small { color: rgba(255, 255, 255, .86); font-size: 15px; }
.wide .welcome .steps li + li { border-color: rgba(255, 255, 255, .18); }
.wide .welcome .promise { grid-column: 1; grid-row: 3; justify-content: flex-start; margin: 20px 64px 0; color: #fff; }
.wide .welcome .card { grid-column: 2; grid-row: 1 / span 2; align-self: center; justify-self: center; width: calc(100% - 96px); max-width: 440px; margin: 0; padding: 28px; }
.wide .welcome .note { grid-column: 2; grid-row: 3; }
@media (hover: hover) {
  .cust:hover { background: #f8f6f0; }
  .tile:hover { box-shadow: 0 2px 4px rgba(23, 35, 28, .08), 0 14px 32px rgba(23, 35, 28, .12); }
  .act:hover, .chip:hover, .item:hover, .send:hover { filter: brightness(.95); }
}
@media (prefers-reduced-motion: no-preference) {
  .chip, .btn, .tile { transition: transform .08s; }
  .enter { animation: enter .22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" hidden></div>
<dialog id="dialog"></dialog>
<script>
"use strict";
const STORE = "kasibook-v1";
const DAY = 864e5;
const MAX_CENTS = 100000 * 100;

// ---------- Rules (no page access) ----------

// Money is kept in whole cents so totals never pick up rounding errors.
const rand = (cents) => "R" + (cents / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

function parseCents(text) {
  const cents = Math.round(Number(String(text).trim().replace(",", ".")) * 100);
  return Number.isInteger(cents) && cents > 0 && cents <= MAX_CENTS ? cents : null;
}

// 082 123 4567 -> 27821234567, the format WhatsApp links need.
function waNumber(phone) {
  const digits = String(phone).replace(/\D/g, "");
  if (/^0\d{9}$/.test(digits)) return "27" + digits.slice(1);
  return /^27\d{9}$/.test(digits) ? digits : null;
}

const balance = (customer) => customer.entries.reduce((sum, entry) => sum + entry.c, 0);

// Money paid back by all customers in the last few days.
const paidSince = (customers, days, now = Date.now()) =>
  customers.flatMap((customer) => customer.entries).reduce((sum, entry) => sum + (entry.c < 0 && entry.t >= now - days * DAY ? -entry.c : 0), 0);

// The last three named items a customer bought, newest first.
const recentItems = (customer) => customer.entries.filter((entry) => entry.n).slice(-3).reverse().map((entry) => entry.n).join(" · ");

const daysToMonthEnd = (now = new Date()) => new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate();

// Payments settle the oldest sales first. Returns the age of the oldest unpaid sale.
function daysOwing(customer, now = Date.now()) {
  const unpaid = [];
  for (const entry of customer.entries) {
    if (entry.c > 0) { unpaid.push({ t: entry.t, left: entry.c }); continue; }
    let paid = -entry.c;
    while (paid > 0 && unpaid.length) {
      const part = Math.min(paid, unpaid[0].left);
      unpaid[0].left -= part;
      paid -= part;
      if (!unpaid[0].left) unpaid.shift();
    }
  }
  return unpaid.length ? Math.floor((now - unpaid[0].t) / DAY) : 0;
}

// A statement travels inside the link itself, so no server ever sees it.
function encodeStatement(shop, customer) {
  const data = { s: shop, n: customer.name, b: balance(customer), e: customer.entries.slice(-12).map((entry) => (entry.n ? [entry.t, entry.c, entry.n] : [entry.t, entry.c])) };
  const bytes = new TextEncoder().encode(JSON.stringify(data));
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

const clampCents = (n) => Math.max(-MAX_CENTS, Math.min(MAX_CENTS, Math.round(n)));

// A statement link can be edited by anyone, so every field is checked and capped.
function decodeStatement(text) {
  try {
    const binary = atob(text.replace(/-/g, "+").replace(/_/g, "/"));
    const data = JSON.parse(new TextDecoder().decode(Uint8Array.from(binary, (ch) => ch.charCodeAt(0))));
    if (typeof data.s !== "string" || typeof data.n !== "string" || !Number.isFinite(data.b) || !Array.isArray(data.e)) return null;
    const entries = data.e.filter((e) => Array.isArray(e) && Number.isFinite(e[0]) && Number.isFinite(e[1])).slice(0, 12);
    return { shop: data.s.slice(0, 40), name: data.n.slice(0, 40), balance: clampCents(data.b), entries: entries.map(([t, c, n]) => ({ t, c: clampCents(c), ...(typeof n === "string" && { n: n.slice(0, 20) }) })) };
  } catch {
    return null;
  }
}

// ---------- Saved data (stays on this phone) ----------

const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function sampleBook() {
  const now = Date.now();
  // Fixed ids, so reloading on a sample customer's page stays on that page.
  const sample = (name, rows) => ({ id: "sample-" + name.split(" ")[0].toLowerCase(), name, phone: "", sample: true, entries: rows.map(([daysAgo, c, n]) => ({ t: now - daysAgo * DAY, c, ...(n && { n }) })) });
  return {
    shop: "Thandi's Spaza",
    customers: [
      sample("Nomsa Khumalo", [[9, 12000, "Maize meal and oil"], [5, 8500, "Electricity"], [2, -2000]]),
      sample("Tshepo Mokoena", [[46, 25000, "Groceries"], [30, 9000, "Airtime and bread"]]),
      sample("Sibusiso Dlamini", [[18, 9500, "Paraffin"]]),
    ],
  };
}

// Returns the saved book, or null on a first visit (the welcome screen then starts one).
function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE));
    if (saved && typeof saved.shop === "string" && Array.isArray(saved.customers)) return saved;
  } catch { /* unreadable or blocked storage: treat as a first visit */ }
  return null;
}

function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify(book));
  } catch {
    alert("Could not save on this phone. Check its storage space.");
  }
}

let book = load();
let mode = "sale"; // what the customer screen records: "sale" or "paid"

// ---------- Page building ----------

const $ = (id) => document.getElementById(id);

// Text is always added as text, never as HTML, so a name can never break the page.
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs)) {
    if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
    else if (value !== false && value != null) node.setAttribute(name, value === true ? "" : value);
  }
  node.append(...children.flat(Infinity).filter((child) => child != null && child !== false));
  return node;
}

// One-tap items. The prices are examples only: every shop sets its own, and any amount can be typed.
const ITEMS = [["🍞", "Bread", 1800], ["🌽", "Maize meal", 4200], ["🥛", "Milk", 3400], ["📱", "Airtime", 2000], ["⚡", "Electricity", 5000], ["🛢️", "Cooking oil", 3800]];

function icon(name, size = 24) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  const path = document.createElementNS(svg.namespaceURI, "path");
  path.setAttribute("d", ICONS[name]);
  for (const [attr, value] of Object.entries({ class: "icon", viewBox: "0 0 24 24", width: size, height: size, "aria-hidden": "true" })) svg.setAttribute(attr, value);
  svg.append(path);
  return svg;
}

// A laptop or office computer can show the wide desktop view. Phones always get the phone view.
const bigScreen = matchMedia("(min-width: 900px)");
let view = bigScreen.matches ? "desktop" : "phone";
try { view = localStorage.getItem(STORE + "-view") || view; } catch { /* storage blocked: keep the default */ }

function setView(value) {
  view = value;
  try { localStorage.setItem(STORE + "-view", value); } catch { /* the choice lasts for this visit only */ }
  render();
}

function viewChoice() {
  if (!bigScreen.matches) return null;
  const tab = (value, text) => el("button", { type: "button", class: "tab", "aria-pressed": String(view === value), onclick: () => setView(value) }, text);
  return [
    el("p", { class: "ask" }, "How do you want to see KasiBook?"),
    el("div", { class: "tabs" }, tab("phone", "Phone view"), tab("desktop", "Desktop view"))];
}

// "Godwin's Spaza" -> "GS", for the round profile badge.
const initials = (name) => name.split(/\s+/).filter(Boolean).slice(0, 2).map((word) => [...word][0]).join("").toUpperCase();

// Which navigation entry matches the page on screen. A customer's page and the two "who?" pages count as Customers.
const currentNav = (route) => (route.startsWith("c=") || route === "list=sale" || route === "list=paid" ? "#list" : "#" + route);

// Desktop view: where you are and where you can go, always in the same place.
function sidebar(route) {
  const link = (href, iconName, text) => el("a", { class: "navlink", href, "aria-current": currentNav(route) === href && "page" }, icon(iconName, 20), text);
  return el("aside", { class: "side" },
    el("div", { class: "brand" }, icon("book", 26), "KasiBook"),
    el("nav", { "aria-label": "Main" },
      link("#", "home", "Dashboard"),
      link("#list", "users", "Customers"),
      link("#tx", "repeat", "Transactions"),
      link("#list=remind", "send", "Reminders")),
    el("div", { class: "side-foot" },
      viewChoice(),
      el("button", { class: "profile", title: "Change shop name", onclick: renameShop },
        el("span", { class: "me" }, initials(book.shop)),
        el("span", {}, el("strong", {}, book.shop), el("small", {}, "Saved on this device")))));
}

// Phone view: the same places, within reach of a thumb.
function tabbar(route) {
  const tab = (href, iconName, text) => el("a", { href, "aria-current": currentNav(route) === href && "page" }, icon(iconName, 22), text);
  return el("nav", { class: "tabbar", "aria-label": "Main" },
    tab("#", "home", "Home"),
    tab("#list", "users", "Customers"),
    el("button", { class: "plus", "aria-label": "Add a customer", onclick: () => customerForm() }, icon("plus", 24)),
    tab("#tx", "repeat", "Transactions"),
    tab("#list=remind", "send", "Reminders"));
}

let toastTimer;
function toast(text, undo) {
  const box = $("toast");
  box.replaceChildren(text, undo ? el("button", { class: "link", onclick: () => { box.hidden = true; undo(); } }, "Undo") : "");
  box.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.hidden = true; }, 7000);
}

const dateText = (t) => new Date(t).toLocaleDateString("en-ZA", { day: "numeric", month: "short", year: "numeric" });

function ageBadge(customer) {
  if (balance(customer) <= 0) return el("span", { class: "badge ok" }, "Paid up");
  const days = daysOwing(customer);
  const text = days < 1 ? "Owing since today" : `Owing for ${days} day${days === 1 ? "" : "s"}`;
  return el("span", { class: "badge" + (days >= 30 ? " late" : days >= 14 ? " due" : "") }, text);
}

// One customer in a list: who they are, how long they have owed, how much, and one-tap actions.
function customerRow(customer, intent) {
  const owed = balance(customer);
  const bought = recentItems(customer);
  const page = "#c=" + customer.id;
  const as = (value) => () => { mode = value; };
  return el("li", { class: "cust" },
    el("span", { class: "avatar", "aria-hidden": "true" }, [...customer.name][0].toUpperCase()),
    el("a", { class: "cust-link", href: page, onclick: as(intent === "paid" ? "paid" : "sale") }, customer.name),
    ageBadge(customer),
    el("span", { class: "amt" }, rand(owed)),
    bought && el("p", { class: "bought" }, bought),
    el("div", { class: "acts" },
      el("a", { class: "act", href: page, onclick: as("sale"), "aria-label": `Add credit for ${customer.name}` }, "+ Credit"),
      owed > 0 && el("a", { class: "act", href: page, onclick: as("paid"), "aria-label": `Record a payment from ${customer.name}` }, "\u2713 Paid"),
      owed > 0 && el("a", { class: "act wa", href: whatsappLink(customer), target: "_blank", rel: "noopener", "aria-label": `Remind ${customer.name} on WhatsApp` }, icon("chat", 16), "Remind")));
}

// Column names for the desktop table. Hidden on a phone, where each customer is a card.
const tableHead = () => el("li", { class: "thead", "aria-hidden": "true" }, ["Customer", "Status", "Amount", "Actions"].map((text) => el("span", {}, text)));

function historyList(entries) {
  if (!entries.length) return el("p", { class: "empty" }, "Nothing written in the book yet.");
  return el("ul", { class: "history" }, [...entries].reverse().map((entry) =>
    el("li", {},
      el("span", {}, `${dateText(entry.t)} · ${entry.c > 0 ? entry.n || "Bought on credit" : "Paid"}`),
      el("strong", { class: entry.c > 0 ? "" : "paid" }, (entry.c > 0 ? "+" : "−") + rand(Math.abs(entry.c))))));
}

// A pop-up form. onSave returns a problem to show, or nothing when all is well.
function openForm(title, fields, onSave) {
  const error = el("p", { class: "error", role: "alert" });
  const inputs = fields.map((field) => el("input", { id: field.id, value: field.value ?? "", autocomplete: "off", ...field.attrs }));
  const submit = (event) => {
    event.preventDefault();
    const problem = onSave(...inputs.map((input) => input.value.trim()));
    if (problem) { error.textContent = problem; return; }
    $("dialog").close();
    render();
  };
  $("dialog").replaceChildren(el("form", { onsubmit: submit },
    el("h2", {}, title),
    fields.map((field, i) => [el("label", { for: field.id }, field.label), inputs[i]]),
    error,
    el("div", { class: "pair" },
      el("button", { type: "button", class: "btn ghost", style: "margin:0", onclick: () => $("dialog").close() }, "Cancel"),
      el("button", { class: "btn primary" }, "Save"))));
  $("dialog").showModal();
}

// ---------- Actions ----------

function startBook(shopName, withSamples) {
  book = withSamples ? sampleBook() : { shop: "My Spaza", customers: [] };
  if (shopName) book.shop = shopName;
  save();
  render(true);
  scrollTo(0, 0);
}

function renameShop() {
  openForm("Your shop's name", [{ id: "shop-name", label: "Shop name", value: book.shop, attrs: { maxlength: 40 } }], (name) => {
    if (!name) return "Please type your shop's name.";
    book.shop = name;
    save();
  });
}

function customerForm(customer) {
  openForm(customer ? "Change customer" : "Add a customer", [
    { id: "customer-name", label: "Name", value: customer?.name, attrs: { maxlength: 40 } },
    { id: "customer-phone", label: "WhatsApp number (optional)", value: customer?.phone, attrs: { inputmode: "tel", placeholder: "082 123 4567" } },
  ], (name, phone) => {
    if (!name) return "Please type the customer's name.";
    if (phone && !waNumber(phone)) return "Use a South African cell number, like 082 123 4567.";
    if (customer) Object.assign(customer, { name, phone, sample: false });
    else {
      const added = { id: newId(), name, phone, entries: [] };
      book.customers.push(added);
      mode = "sale";
      location.hash = "c=" + added.id;
    }
    save();
  });
}

function record(customer, cents, error, item) {
  const owed = balance(customer);
  if (cents < 0 && -cents > owed) { error.textContent = `${customer.name} only owes ${rand(owed)}.`; return; }
  if (owed + cents > MAX_CENTS) { error.textContent = `One customer can owe at most ${rand(MAX_CENTS)}.`; return; }
  const entry = { t: Date.now(), c: cents, ...(item && { n: item }) };
  customer.entries.push(entry);
  save();
  render();
  toast(cents > 0 ? `Added ${item ? item + " " : ""}${rand(cents)} to ${customer.name}` : `${customer.name} paid ${rand(-cents)}`, () => {
    customer.entries.splice(customer.entries.indexOf(entry), 1);
    save();
    render();
  });
}

function removeLast(customer) {
  const removed = customer.entries.pop();
  save();
  render();
  toast("Last entry removed", () => {
    customer.entries.push(removed);
    save();
    render();
  });
}

function removeCustomer(customer) {
  if (!confirm(`Delete ${customer.name} and their history? This cannot be undone.`)) return;
  book.customers = book.customers.filter((other) => other !== customer);
  save();
  location.hash = "";
}

function clearSamples() {
  book.customers = book.customers.filter((customer) => !customer.sample);
  save();
  render();
}

function whatsappLink(customer) {
  const owed = balance(customer);
  const first = customer.name.split(" ")[0];
  const statement = location.href.split("#")[0] + "#s=" + encodeStatement(book.shop, customer);
  const text = owed > 0
    ? `Hi ${first}, a friendly reminder from ${book.shop}: your balance is ${rand(owed)}.\n\nSee your statement:\n${statement}\n\nThank you!`
    : `Hi ${first}, your account at ${book.shop} is paid up. Thank you!\n\nYour statement:\n${statement}`;
  return `https://wa.me/${waNumber(customer.phone) ?? ""}?text=${encodeURIComponent(text)}`;
}

  const step = (iconName, tone, title, text) => el("li", {},
    el("span", { class: "bubble " + tone }, icon(iconName)),
    el("span", {}, el("strong", {}, title), el("small", {}, text)));
  return el("div", { class: "welcome" },
    el("header", { class: "top" },
      el("div", { class: "logo" }, icon("book", 40)),
      el("h1", {}, "Welcome to KasiBook"),
      el("p", { class: "lead" }, "Your shop's credit book, on your phone. No more lost pages.")),
    el("ol", { class: "steps" },
      step("bag", "", "Write it down in two taps", "Tap a customer, tap the amount. KasiBook adds it up."),
      step("clock", "gold", "See who owes you", "Every balance, and how long it has been owing."),
      step("chat", "blue", "Remind them on WhatsApp", "One tap sends a polite message with their statement.")),
    el("p", { class: "promise" }, icon("phone", 18), "Works with no data. No sign-up. Free."),
    el("form", { class: "card", onsubmit: (event) => { event.preventDefault(); startBook(shop.value.trim(), false); } },

      el("label", { for: "shop" }, "What is your shop called?"),
      shop,
      el("button", { class: "btn primary" }, "Start my book"),
      el("button", { type: "button", class: "btn ghost", onclick: () => startBook(shop.value.trim(), true) }, "Try it with sample customers")),
    el("p", { class: "note", style: "text-align:center;margin-bottom:24px" }, "Your book stays on this device. Nobody else can see it."));
}

      el("div", { class: "topbar" },

        el("div", { class: "kpis" },

      el("a", { class: "send", href: "#list=remind" }, icon("send", 16), "Send reminders")),
    el("div", { class: "section" }, el("h2", {}, "What would you like to do?")),

    book.customers.length === 0 && el("p", { class: "note" }, "Your book is empty. Tap \"Add a customer\" to write your first name in it."),
    book.customers.some((customer) => customer.sample) && el("p", { class: "note" },
      "These are sample customers so you can try KasiBook. ",
      el("button", { class: "link", onclick: clearSamples }, "Clear samples")),
    el("p", { class: "note", style: "margin-bottom:24px" }, "Saved on this device. Works with no data."));
}

// The customer list. It also answers "who bought?", "who paid?" and "who should I remind?".
function listScreen(intent) {
  const customers = book.customers.filter((customer) => intent !== "remind" || balance(customer) > 0).sort((a, b) => balance(b) - balance(a));
  const rows = customers.map((customer) => customerRow(customer, intent));
  const monthOf = (t) => new Date(t).getFullYear() * 12 + new Date(t).getMonth();
  const filters = [
    ["All", () => true],
    ["Over 30 days", (customer) => balance(customer) > 0 && daysOwing(customer) >= 30],
    ["Bought this month", (customer) => customer.entries.some((entry) => entry.c > 0 && monthOf(entry.t) === monthOf(Date.now()))],
  ];
  let wanted = filters[0][1];
  const none = el("p", { class: "note", hidden: true }, "No customers match.");
  const show = () => {
    const text = search.value.trim().toLowerCase();
    rows.forEach((row, i) => { row.hidden = !(wanted(customers[i]) && customers[i].name.toLowerCase().includes(text)); });
    none.hidden = rows.some((row) => !row.hidden);
  };
  const search = el("input", { id: "search", type: "search", autocomplete: "off", placeholder: "Search by name", "aria-label": "Search customers by name", oninput: show });
  const pills = filters.map(([label, test], i) => el("button", { class: "filter", "aria-pressed": String(i === 0), onclick: () => {
    wanted = test;
    pills.forEach((pill, j) => pill.setAttribute("aria-pressed", String(i === j)));
    show();
  } }, `${label} (${customers.filter(test).length})`));
  const title = { sale: "Who bought on credit?", paid: "Who paid you?", remind: "Send reminders" }[intent] ?? "Customers";
  const hint = !customers.length ? (intent === "remind" ? "Nobody owes you right now." : "No customers in your book yet.")
    : intent === "remind" ? "Tap Remind to open WhatsApp with the message already written." : "Tap a name to open their page.";
  return el("div", {},
    el("header", { class: "top" },
      el("a", { class: "back", href: "#" }, icon("left", 20), "Home"),
      el("h1", { tabindex: "-1" }, title),
      el("p", { class: "label", style: "margin-top:6px" }, hint)),
    customers.length > 0 && [
      el("div", { class: "search" }, icon("search", 20), search),
      el("div", { class: "filters" }, pills),
      el("ul", { class: "list" }, tableHead(), rows),
      none]);
}

// Every sale and payment in the book, newest first.
function transactionsScreen() {
  const entries = book.customers.flatMap((customer) => customer.entries.map((entry) => ({ ...entry, customer }))).sort((a, b) => b.t - a.t).slice(0, 100);
  return el("div", {},
    el("header", { class: "top" },
      el("a", { class: "back", href: "#" }, icon("left", 20), "Home"),
      el("h1", { tabindex: "-1" }, "Transactions"),
      el("p", { class: "label", style: "margin-top:6px" }, "Every sale and payment, newest first.")),
    el("section", { class: "card" }, entries.length
      ? el("ul", { class: "history" }, entries.map((entry) => el("li", {},
          el("span", {}, `${dateText(entry.t)} \u00b7 `, el("a", { href: "#c=" + entry.customer.id, style: "color:var(--green);font-weight:700" }, entry.customer.name), ` \u00b7 ${entry.c > 0 ? entry.n || "Bought on credit" : "Paid"}`),
          el("strong", { class: entry.c > 0 ? "" : "paid" }, (entry.c > 0 ? "+" : "\u2212") + rand(Math.abs(entry.c))))))
      : el("p", { class: "empty" }, "Nothing written in the book yet.")));
}

function customerScreen(customer) {
  const owed = balance(customer);
  const paying = mode === "paid" && owed > 0;
  const sign = paying ? -1 : 1;
  const error = el("p", { class: "error", role: "alert" });
  const amount = el("input", { id: "amount", inputmode: "decimal", autocomplete: "off", placeholder: "For example 35.50" });
  const typed = (event) => {
    event.preventDefault();
    const cents = parseCents(amount.value);
    if (cents) return record(customer, sign * cents, error);
    error.textContent = "Type an amount in rands, for example 35.50";
    amount.focus();
  };
  const tab = (value, text, disabled) =>
    el("button", { class: "tab", "aria-pressed": String(paying === (value === "paid")), disabled, onclick: () => { mode = value; render(); } }, text);
  return el("div", { class: "split" },
    el("header", { class: "top" },
      el("a", { class: "back", href: "#" }, icon("left", 20), "Home"),
      el("h1", { tabindex: "-1" }, customer.name),
      el("button", { class: "link", onclick: () => customerForm(customer) }, customer.phone || "Add WhatsApp number"),
      el("div", { class: "hero" },
        el("p", { class: "label" }, "Owes you"),
        el("p", { class: "total" }, rand(owed)),
        ageBadge(customer))),
    el("section", { class: "card" },
      el("div", { class: "tabs" }, tab("sale", "Sold on credit"), tab("paid", "Got paid", owed <= 0)),
      !paying && [
        el("h2", {}, "What did they buy?"),
        el("div", { class: "items" }, ITEMS.map(([emoji, name, cents]) =>
          el("button", { class: "item", onclick: () => record(customer, cents, error, name) },
            el("span", { "aria-hidden": "true" }, emoji), name, el("small", {}, "R" + cents / 100))))],
      el("h2", {}, paying ? "How much did they pay?" : "Or tap an amount"),
      el("div", { class: "chips" }, [10, 20, 50, 100].map((rands) =>
        el("button", { class: "chip", onclick: () => record(customer, sign * rands * 100, error) }, (paying ? "R" : "+R") + rands))),
      el("form", { onsubmit: typed },
        el("label", { for: "amount" }, "Or type another amount"),
        amount,
        error,
        el("button", { class: "btn primary" }, paying ? "Record payment" : "Add to book")),
      paying && el("button", { class: "btn ghost", onclick: () => record(customer, -owed, error) }, `Paid in full (${rand(owed)})`)),
    el("a", { class: "btn whatsapp", href: whatsappLink(customer), target: "_blank", rel: "noopener" },
      icon("chat", 22), owed > 0 ? "Remind on WhatsApp" : "Send statement on WhatsApp"),
    el("section", { class: "card" },
      el("div", { class: "head" },
        el("h2", {}, "History"),
        customer.entries.length > 0 && el("button", { class: "link", onclick: () => removeLast(customer) }, "Remove last entry")),
      historyList(customer.entries)),
    el("button", { class: "link danger", onclick: () => removeCustomer(customer) }, "Delete this customer"));
}

// What a customer sees when they open the link in their WhatsApp message.
function statementScreen(statement) {
  if (!statement) {
    return el("div", {}, el("section", { class: "card" },
      el("h1", {}, "This statement did not open"),
      el("p", { class: "empty", style: "margin-top:8px" }, "Please ask the shop to send it again.")));
  }
  return el("div", {},
    el("header", { class: "top" },
      el("div", { class: "brand" }, icon("book", 20), "KasiBook"),
      el("p", { class: "label" }, statement.shop),
      el("h1", { tabindex: "-1" }, `Statement for ${statement.name}`),
      el("div", { class: "hero" },
        el("p", { class: "label" }, statement.balance > 0 ? "You owe" : "You are paid up"),
        el("p", { class: "total", style: "margin-bottom:0" }, rand(Math.max(0, statement.balance))))),
    el("section", { class: "card" }, el("h2", {}, "Latest entries"), historyList(statement.entries)),
    el("p", { class: "note" }, "This is a copy of your page in the shop's credit book, from the day it was sent. The shop's own book is the final record. If something looks wrong, speak to the shop owner."),
    el("p", { class: "note", style: "margin-bottom:24px" }, el("a", { href: "#", style: "color:var(--green);font-weight:700" }, "Run a shop? Keep your own book with KasiBook")));
}

// Pass true when moving to a new screen, so it slides in. Updates in place stay still.
function render(moved) {
  const route = location.hash.slice(1);
  const customer = book && route.startsWith("c=") && book.customers.find((c) => c.id === route.slice(2));
  const screen = route.startsWith("s=") ? statementScreen(decodeStatement(route.slice(2)))
    : !book ? welcomeScreen()
    : customer ? customerScreen(customer)
    : route === "tx" ? transactionsScreen()
    : route.startsWith("list") ? listScreen(route.slice(5))
    : homeScreen();
  const wide = view === "desktop" && bigScreen.matches;
  const shell = Boolean(wide && book && !route.startsWith("s="));
  document.body.classList.toggle("wide", wide);
  $("app").classList.toggle("shell", shell);
  const tabs = Boolean(!wide && book && !route.startsWith("s="));
  screen.classList.toggle("main", shell);
  screen.classList.toggle("has-tabs", tabs);
  if (moved) screen.classList.add("enter");
  // Phone view on a big screen: every page keeps a way back to the desktop view.
  const wayBack = tabs && bigScreen.matches && el("button", { class: "viewswitch", onclick: () => setView("desktop") }, icon("left", 18), "Desktop view");
  $("app").replaceChildren(...(shell ? [sidebar(route)] : []), screen, ...(tabs ? [tabbar(route)] : []), ...(wayBack ? [wayBack] : []));
}

addEventListener("hashchange", () => {
  render(true);
  scrollTo(0, 0);
  document.querySelector("h1")?.focus();
});
render(true);
bigScreen.addEventListener("change", () => render());

// Another open tab changed the book: show the newest copy so no tab overwrites the other.
addEventListener("storage", (event) => {
  if (event.key === STORE) { book = load(); render(); }
});

// Saves a copy of the app on the phone so it opens with no internet.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js");
}

// Self-check of the rules: open index.html?test and read the browser console.
if (location.search === "?test") {
  const sipho = { name: "Sipho", entries: [{ t: 0, c: 5000 }, { t: 10 * DAY, c: 3000 }, { t: 11 * DAY, c: -5000 }] };
  console.assert(rand(124050) === "R1 240.50", "rand");
  console.assert(parseCents("35,5") === 3550 && parseCents("0") === null && parseCents("abc") === null, "parseCents");
  console.assert(waNumber("082 123 4567") === "27821234567" && waNumber("12345") === null, "waNumber");
  console.assert(balance(sipho) === 3000 && daysOwing(sipho, 20 * DAY) === 10, "balance and daysOwing");
  console.assert(decodeStatement(encodeStatement("Thandi's Spaza", sipho)).balance === 3000, "statement link");
  console.assert(decodeStatement("not a statement") === null, "bad statement link");
  console.assert(paidSince([sipho], 7, 12 * DAY) === 5000 && paidSince([sipho], 7, 30 * DAY) === 0, "paidSince");
  console.assert(recentItems({ entries: [{ c: 1, n: "Bread" }, { c: 1 }, { c: 1, n: "Milk" }] }) === "Milk · Bread", "recentItems");
  console.assert(daysToMonthEnd(new Date(2026, 10, 17)) === 13, "daysToMonthEnd");
  console.log("KasiBook self-check finished");
}
</script>
